name: Audyt + raport (Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 1"   # poniedziałki, 20:00 czasu PL

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  audit-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Testy jednostkowe
        run: python3 tests/test_doctor.py
      - name: Audyt konta SigPath
        run: python3 -m repo_doctor audit --user SigPath --out docs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: d
        uses: actions/deploy-pages@v4
